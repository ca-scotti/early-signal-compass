<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahead — Today</title>
  <meta name="description" content="A team lead's day in order, with the moments to step in on an analyst's work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div class="app">

    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M5 25 15.5 6 26 25M10 17h12" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m21 5 6 0 0 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        ahead
      </div>
      <div class="firm-name meta" data-text="firmName"></div>

      <button class="nav-item active" data-nav="today"><span data-icon="sun"></span>Today</button>
      <button class="nav-item" data-nav="team"><span data-icon="users"></span>Team</button>
      <button class="nav-item" data-nav="work"><span data-icon="list"></span>All commitments</button>

      <div class="user-profile">
        <span class="avatar" data-text="leadInitials"></span>
        <div>
          <div class="profile-name" data-text="leadFullName"></div>
          <div class="meta" data-text="leadRole"></div>
        </div>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <main class="main">
      <div class="content">

        <p class="meta greeting" id="now"></p>

        <!-- Right now: the current part of the day. The hero of the page -->
        <div id="plan"></div>

        <!-- The team, in a few words -->
        <section class="quiet-section" id="team-card" aria-labelledby="team-heading">
          <h2 class="section-label" id="team-heading">Your team this week</h2>
          <ul class="team-list" id="team-list"></ul>
        </section>

        <!-- Full list, collapsed by default -->
        <section class="all-work" id="all-work" aria-labelledby="all-work-heading">
          <h2 class="sr-only" id="all-work-heading">All commitments</h2>
          <button class="btn-text all-work-toggle" id="all-work-toggle" aria-expanded="false" aria-controls="all-work-panel"></button>
          <div class="card" id="all-work-panel" hidden>
            <div class="filter-bar">
              <select class="filter-select" id="filter-engagement" aria-label="Filter by engagement"></select>
              <select class="filter-select" id="filter-owner" aria-label="Filter by person"></select>
              <select class="filter-select" id="filter-status" aria-label="Filter by status">
                <option value="all">Any status</option>
                <option value="at-risk">At risk</option>
                <option value="overdue">Overdue</option>
                <option value="on-track">On track</option>
              </select>
              <button class="btn-text" id="filter-reset" hidden>Clear filters</button>
            </div>
            <table class="work-table">
              <thead>
                <tr>
                  <th>Commitment</th>
                  <th class="col-owner">Owner</th>
                  <th class="col-due">Due</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="work-table-body"></tbody>
            </table>
          </div>
        </section>

        <footer class="page-footer" data-text="footer"></footer>
      </div>
    </main>
  </div>

  <!-- Side panel (filled in by app.js when you click an item you step in on) -->
  <div class="sheet-overlay" id="sheet-overlay" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
